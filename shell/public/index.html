<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common App Shell</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="rail" aria-label="App rail">
      <button id="logo" class="logo" title="Store" aria-label="Open the Store">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="5.7" y="5.7" width="12.6" height="12.6" rx="2.4"
                transform="rotate(45 12 12)" fill="currentColor" />
        </svg>
      </button>

      <nav id="tablist" class="tablist" aria-label="Installed apps">
        <!-- app tiles + the "+" import button are injected here by app.js -->
      </nav>

      <div class="rail-footer">
        <button id="settingsBtn" class="rail-btn settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" fill-rule="evenodd" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
        </button>
      </div>
    </aside>

    <main id="stage">
      <iframe id="frame" title="Active app" allow="clipboard-read; clipboard-write"></iframe>
      <div id="statusPane" class="status-pane" hidden></div>
      <div id="empty" class="empty" hidden>
        <p>Nothing added yet.</p>
        <p class="muted">Open the Store from the logo, or paste a repo URL with <strong>+</strong>.</p>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
