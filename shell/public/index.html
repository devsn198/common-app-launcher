<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common App Launcher</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="rail" aria-label="App rail">
      <button id="logo" class="logo" title="Store" aria-label="Open the Store">
        <!-- A real element rather than ::after, so its exact frame can be pinned
             when the animation is stopped (see setGem in app.js). -->
        <span class="gem-halo" aria-hidden="true"></span>
        <img src="/mark.svg" alt="" width="26" height="26" aria-hidden="true" />
      </button>

      <nav id="tablist" class="tablist" aria-label="Installed apps">
        <!-- app tiles + the "+" import button are injected here by app.js -->
      </nav>

      <div class="rail-footer">
        <button id="settingsBtn" class="rail-btn settings" title="Settings" aria-label="Settings">
          <img src="/gear.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </aside>

    <main id="stage">
      <iframe id="frame" title="Active app" allow="clipboard-read; clipboard-write"></iframe>
      <div id="settingsPane" class="settings-pane" hidden></div>
      <div id="statusPane" class="status-pane" hidden></div>
      <div id="empty" class="empty" hidden>
        <p>Nothing added yet.</p>
        <p class="muted">Open the Store from the logo, or paste a repo URL with <strong>+</strong>.</p>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
