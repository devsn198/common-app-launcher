<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store</title>
    <!-- App Rail's design system. Apps are proxied onto the Shell's origin,
         so this absolute path resolves even from inside the iframe. Adopting it
         is how an app inherits the look instead of copying the palette. -->
    <link rel="stylesheet" href="/theme.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--s-0); color: var(--text);
        font: var(--fs-md) / var(--lh) var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1180px; margin: 0 auto; padding: var(--pane-pad) var(--pane-pad) 72px; }
      h1 { font-size: var(--fs-xl); margin: 0 0 var(--sp-5); letter-spacing: -0.01em; font-weight: 650; }

      .search { display: flex; gap: var(--sp-2); max-width: 860px; }
      .search input {
        flex: 1; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border);
        border-radius: var(--r-md); background: var(--s-1); color: var(--text);
        font: var(--fs-md) var(--font-ui);
        box-shadow: var(--depth-sunken);
      }
      .search input::placeholder { color: var(--muted); }
      .search input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
      .search button {
        padding: var(--sp-3) var(--sp-5); border: 0; border-radius: var(--r-md);
        background: var(--accent); color: #fff; font: 500 var(--fs-md) var(--font-ui); cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), var(--elev-contact);
      }
      .search button:hover { filter: brightness(1.08); }

      /* Section header: label on the left, count / controls on the right. */
      .shead { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-6) 2px var(--sp-3); }
      .shead h2 {
        font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.07em;
        color: var(--muted); margin: 0; font-weight: 600;
      }
      .shead .cnt { color: var(--muted); font-size: var(--fs-sm); font-family: var(--font-mono); }
      .shead .sp { flex: 1 1 auto; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--sp-3); }

      .card {
        display: flex; align-items: center; gap: var(--sp-4);
        background: var(--s-1); border: 1px solid var(--line);
        border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); min-width: 0;
        min-height: 72px;
        box-shadow: var(--depth-rest);
        transition: border-color var(--dur-1) var(--ease), background var(--dur-1) var(--ease),
                    box-shadow var(--dur-1) var(--ease);
      }
      .card:hover { border-color: var(--s-3); box-shadow: var(--depth-raised); }
      .ico {
        flex: 0 0 auto; width: calc(var(--tile-icon) * 1.7); height: calc(var(--tile-icon) * 1.7);
        border-radius: var(--r-md);
        background: var(--s-2); display: grid; place-items: center; overflow: hidden;
        font-weight: 600; font-size: var(--fs-lg); color: var(--muted);
        box-shadow: var(--depth-rest);
      }
      .ico img { width: var(--tile-icon); height: var(--tile-icon); object-fit: contain; }
      .meta { flex: 1 1 auto; min-width: 0; }
      .nm { font-weight: 600; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sb { color: var(--muted); font-size: var(--fs-sm); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sb .dot { margin-right: 5px; }

      .btn {
        padding: var(--sp-2) var(--sp-4); border: 0; border-radius: var(--r-sm);
        background: var(--accent); color: #fff; font: 500 var(--fs-sm) var(--font-ui);
        cursor: pointer; flex: 0 0 auto;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26), var(--elev-contact);
      }
      .btn:hover { filter: brightness(1.08); }
      .btn:disabled { opacity: .6; cursor: default; }
      .btn.ghost { background: var(--s-2); color: var(--text); border: 1px solid var(--border); box-shadow: var(--depth-rest); }
      .btn.ghost:hover { background: var(--surface-hi); filter: none; }
      .btn.danger { background: var(--bad); color: #fff; }
      .btn.small { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); }

      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
      .dot.healthy { background: var(--ok); }
      .dot.crashed, .dot.failed { background: var(--bad); }
      .dot.starting, .dot.unhealthy { background: var(--warn); }

      /* Selection is carried by the card itself — border plus a tinted fill is
         unambiguous at this size, so a checkbox would only add clutter. */
      #installed.selecting .card { cursor: pointer; }
      .card.selected {
        border-color: var(--accent);
        background: var(--accent-weak);
        box-shadow: inset 0 0 0 1px var(--accent-line);
      }

      .note { color: var(--muted); font-size: var(--fs-md); padding: var(--sp-1) 2px; }
      .note.err { color: var(--bad); }
      .note.ok { color: var(--ok); }
      .req { color: var(--muted); font-size: var(--fs-sm); margin: var(--sp-3) 2px 0; max-width: 860px; }
      .req code { font-family: var(--font-mono); color: var(--text); font-size: 0.94em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Store</h1>

      <form class="search" id="searchForm">
        <input id="user" placeholder="GitHub account or repo URL" autocomplete="off" spellcheck="false" />
        <button type="submit">Go</button>
      </form>
      <p class="req">
        Apps must ship an <code>app.manifest.json</code> at the repo root — or in the linked
        subfolder. Repos without one cannot run here.
      </p>

      <section id="availSec" hidden>
        <div class="shead">
          <h2>Available</h2>
          <span class="cnt" id="availCnt"></span>
        </div>
        <div id="results"></div>
      </section>

      <section>
        <div class="shead">
          <h2>Added</h2>
          <span class="cnt" id="addedCnt"></span>
          <span class="sp"></span>
          <button id="removeBtn" class="btn danger small" hidden>Remove</button>
          <button id="selectBtn" class="btn ghost small" hidden>Select</button>
        </div>
        <div id="installed"></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const results = $('results');
      const availSec = $('availSec');
      const availCnt = $('availCnt');
      const addedCnt = $('addedCnt');
      const installedEl = $('installed');
      const selectBtn = $('selectBtn');
      const removeBtn = $('removeBtn');

      const LS_KEY = 'store:search';

      let installedIds = new Set();
      let installedApps = [];
      let selectMode = false;
      const selected = new Set();

      // The "Available" panel's state. Either a result set ({label, apps}) or a
      // transient message ({notice}). Result sets are persisted; notices are not.
      let view = null;

      const mono = (s) => (s || '?').trim().charAt(0).toUpperCase() || '?';

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      // ── Persistence ────────────────────────────────────────────────────────
      // The shell reuses one iframe for every tab, so leaving the Store and
      // coming back reloads this page. Keep the query + results so the user
      // doesn't have to re-type the URL (and we don't re-spend rate limit).
      // The typed query is kept independently of any results: pasting a repo URL
      // and adding it directly never produces a result set, but the URL is still
      // what the user would expect to find waiting when they come back.
      function persist() {
        try {
          const q = $('user').value;
          const payload = { q, view: view && view.apps ? view : null };
          if (!q && !payload.view) localStorage.removeItem(LS_KEY);
          else localStorage.setItem(LS_KEY, JSON.stringify(payload));
        } catch {}
      }

      function restore() {
        try {
          const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
          if (!saved) return;
          $('user').value = saved.q || '';
          if (saved.view && Array.isArray(saved.view.apps)) view = saved.view;
        } catch {}
      }

      // ── Input parsing ──────────────────────────────────────────────────────
      // Decide whether the input is a GitHub *account* (search all its apps) or a
      // single *repo* (add it directly). Also accepts non-GitHub git URLs / local paths.
      function classify(input) {
        const s = input.trim().replace(/^@/, '').replace(/\/+$/, '');
        if (!s) return null;
        const i = s.toLowerCase().indexOf('github.com');
        if (i !== -1) {
          const segs = s.slice(i + 'github.com'.length).replace(/^[/:]+/, '').split(/[/#?]/).filter(Boolean);
          const user = segs[0];
          const repo = segs[1] && segs[1].replace(/\.git$/i, '');
          if (user && repo) {
            const url = `https://github.com/${user}/${repo}.git`;
            // …/tree/<branch>/<subpath> or …/blob/<branch>/<subpath> → install from that subfolder.
            if ((segs[2] === 'tree' || segs[2] === 'blob') && segs.length > 4) {
              const branch = segs[3];
              const subpath = segs.slice(4).join('/');
              return { type: 'repo', url, branch, subpath, owner: user, repo, label: `${user}/${repo}/${subpath}` };
            }
            return { type: 'repo', url, owner: user, repo, label: `${user}/${repo}` };
          }
          if (user) return { type: 'account', user };
          return null;
        }
        // No github.com: a full git URL / ssh / local path → add directly; else a bare username.
        if (/^https?:\/\/|^git@|^ssh:\/\/|^file:\/\//i.test(s) || /^[/.]/.test(s) || /\.git$/i.test(s)) {
          return { type: 'repo', url: s, label: s };
        }
        return { type: 'account', user: s.split(/[/#?]/)[0] };
      }

      function iconHtml(src, name) {
        return src
          ? `<img src="${escapeHtml(src)}" alt="" onerror="this.replaceWith(document.createTextNode('${mono(name)}'))">`
          : mono(name);
      }

      // ── Available (search results) ─────────────────────────────────────────
      function notice(text, cls) {
        view = { notice: { text, cls: cls || '' } };
        renderResults();
      }

      function renderResults() {
        if (!view) { availSec.hidden = true; return; }
        availSec.hidden = false;

        if (view.notice) {
          availCnt.textContent = '';
          results.className = '';
          results.innerHTML = `<p class="note ${view.notice.cls}">${escapeHtml(view.notice.text)}</p>`;
          return;
        }

        // Anything already installed lives in "Added" — listing it here too is
        // just noise. `view.apps` keeps the full result set, so uninstalling an
        // app makes it reappear here without needing another search.
        const shown = view.apps.filter((a) => !installedIds.has(a.id));
        availCnt.textContent = `${shown.length} · ${view.label}`;

        if (!shown.length) {
          results.className = '';
          results.innerHTML = `<p class="note">Every app from ${escapeHtml(view.label)} is added.</p>`;
          return;
        }

        results.className = 'grid';
        results.innerHTML = shown.map((a) => `
            <div class="card">
              <div class="ico">${iconHtml(a.icon, a.name)}</div>
              <div class="meta">
                <div class="nm">${escapeHtml(a.name)}</div>
                <div class="sb">${escapeHtml(a.sub)}</div>
              </div>
              <button class="btn" data-url="${escapeHtml(a.cloneUrl)}">Add</button>
            </div>`).join('');

        results.querySelectorAll('button.btn').forEach((btn) => {
          btn.addEventListener('click', () => addApp(btn));
        });
      }

      // Detect app.manifest.json via raw (not counted against the API rate limit).
      // `no-cache` revalidates rather than trusting the HTTP cache: a transient 4xx/5xx
      // from a previous scan would otherwise stick around and hide the app.
      async function fetchManifest(user, repo, branch, subpath) {
        const file = `${subpath ? subpath.replace(/^\/+|\/+$/g, '') + '/' : ''}app.manifest.json`;
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/${branch || 'HEAD'}/${file}`, { cache: 'no-cache' });
          if (!res.ok) return null;
          return await res.json();
        } catch { return null; }
      }

      // Pull the app's declared logo and inline it as a data URI. Going through
      // fetch (rather than pointing <img> at raw.githubusercontent) sidesteps the
      // content-type raw serves for .svg, and a data: URI in <img> can't run script.
      async function fetchLogo(user, repo, branch, logoPath) {
        if (!logoPath || typeof logoPath !== 'string') return null;
        const clean = logoPath.replace(/^\/+/, '');
        if (clean.includes('..')) return null;
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/${branch}/${clean}`, { cache: 'no-cache' });
          if (!res.ok) return null;
          const buf = await res.arrayBuffer();
          if (buf.byteLength > 256 * 1024) return null; // an icon this big isn't an icon
          const type = /\.svg$/i.test(clean) ? 'image/svg+xml'
            : /\.png$/i.test(clean) ? 'image/png'
            : /\.jpe?g$/i.test(clean) ? 'image/jpeg'
            : /\.gif$/i.test(clean) ? 'image/gif'
            : /\.webp$/i.test(clean) ? 'image/webp'
            : null;
          if (!type) return null;
          const bytes = new Uint8Array(buf);
          let bin = '';
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return `data:${type};base64,${btoa(bin)}`;
        } catch { return null; }
      }

      async function search(user) {
        notice('Searching…');
        let repos;
        try {
          const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`);
          if (res.status === 404) return notice(`No GitHub account “${user}”.`, 'err');
          if (res.status === 403) return notice('GitHub rate limit reached. Try again later.', 'err');
          if (!res.ok) return notice(`GitHub error (${res.status}).`, 'err');
          repos = await res.json();
        } catch {
          return notice('Could not reach GitHub.', 'err');
        }

        const scanned = repos.slice(0, 40);
        notice(`Scanning ${scanned.length} repos…`);

        const found = (await Promise.all(scanned.map(async (r) => {
          const branch = r.default_branch || 'HEAD';
          const manifest = await fetchManifest(user, r.name, branch);
          if (!manifest || !manifest.id) return null;
          return {
            id: manifest.id,
            name: manifest.name || r.name,
            sub: `${user}/${r.name}`,
            cloneUrl: r.clone_url || `https://github.com/${user}/${r.name}.git`,
            icon: await fetchLogo(user, r.name, branch, manifest.logo),
          };
        }))).filter(Boolean);

        if (!found.length) return notice(`No apps in ${scanned.length} repos.`, '');

        view = { label: user, apps: found };
        renderResults();
        persist();
      }

      async function addApp(btn) {
        const repoUrl = btn.dataset.url;
        btn.disabled = true;
        btn.textContent = 'Adding…';
        try {
          const res = await fetch('/shell/install', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repoUrl }),
          });
          const data = await res.json();
          if (res.ok) {
            window.parent.postMessage('shell:refresh', '*'); // update the rail
            await loadInstalled();
          } else {
            btn.disabled = false;
            btn.textContent = 'Add';
            alert(data.error || 'Install failed.');
          }
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Add';
          alert('Request failed: ' + e.message);
        }
      }

      // Add a single repo directly by its URL (or local path). `c` may carry a
      // subpath/branch for monorepo subfolder installs.
      async function importDirect(c) {
        // Pre-flight: a repo without a manifest can never run here, and the
        // server would only discover that after a full clone. Probing the raw
        // file first costs one request and no rate limit, so refuse up front
        // rather than making the user wait to be told no.
        if (c.owner && c.repo) {
          notice(`Checking ${c.label} for an app.manifest.json…`);
          const manifest = await fetchManifest(c.owner, c.repo, c.branch, c.subpath);
          if (!manifest) {
            return notice(
              `${c.label} has no app.manifest.json${c.subpath ? ` in ${c.subpath}` : ''}, ` +
              `so it was not built for App Rail and cannot be imported. ` +
              `Fork it and add a manifest to run it here.`, 'err');
          }
          if (!manifest.id || !manifest.start || !manifest.healthCheck) {
            return notice(
              `${c.label} has an app.manifest.json, but it is missing required fields ` +
              `(needs at least id, start and healthCheck).`, 'err');
          }
        }

        notice(`Adding ${c.label}…`);
        try {
          const res = await fetch('/shell/install', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repoUrl: c.url, subpath: c.subpath, branch: c.branch }),
          });
          const data = await res.json();
          if (res.ok) {
            notice(`Added “${data.app.name}”.`, 'ok');
            window.parent.postMessage('shell:refresh', '*');
            await loadInstalled();
          } else {
            notice(data.error || 'Install failed.', 'err');
          }
        } catch (e) {
          notice('Request failed: ' + e.message, 'err');
        }
        persist(); // a notice isn't cached — drop any stale saved result set
      }

      // ── Added (installed apps) ─────────────────────────────────────────────
      async function loadInstalled() {
        try {
          const res = await fetch('/shell/apps');
          const { apps } = await res.json();
          installedApps = apps.filter((a) => a.id !== 'store');
          installedIds = new Set(installedApps.map((a) => a.id));
          for (const id of [...selected]) if (!installedIds.has(id)) selected.delete(id);
        } catch {
          installedEl.innerHTML = '<p class="note err">Could not load installed apps.</p>';
          return;
        }
        renderInstalled();
        if (view && view.apps) renderResults(); // keep Add/Added buttons in sync
      }

      function renderInstalled() {
        const list = installedApps;
        addedCnt.textContent = list.length ? String(list.length) : '';
        selectBtn.hidden = list.length === 0;
        selectBtn.textContent = selectMode ? 'Cancel' : 'Select';
        removeBtn.hidden = !selectMode;
        removeBtn.disabled = selected.size === 0;
        removeBtn.textContent = selected.size ? `Remove (${selected.size})` : 'Remove';
        installedEl.classList.toggle('selecting', selectMode);

        if (!list.length) {
          selectMode = false;
          selectBtn.hidden = true;
          removeBtn.hidden = true;
          installedEl.className = '';
          installedEl.innerHTML = '<p class="note">Nothing added yet.</p>';
          return;
        }

        installedEl.className = 'grid' + (selectMode ? ' selecting' : '');
        installedEl.innerHTML = list.map((a) => {
          const sel = selected.has(a.id);
          const src = a.logo ? `/apps/${a.id}/${String(a.logo).replace(/^\/+/, '')}` : null;
          // Only spell out the status when it's something the user should act on.
          const sub = a.status === 'healthy'
            ? (a.version ? 'v' + a.version : 'Ready')
            : a.status;
          return `
            <div class="card${sel ? ' selected' : ''}" data-id="${a.id}">
              <div class="ico">${iconHtml(src, a.name)}</div>
              <div class="meta">
                <div class="nm">${escapeHtml(a.name)}</div>
                <div class="sb"><span class="dot ${a.status}"></span>${escapeHtml(sub)}</div>
              </div>
            </div>`;
        }).join('');

        if (selectMode) {
          installedEl.querySelectorAll('.card').forEach((card) => {
            card.addEventListener('click', () => {
              const id = card.dataset.id;
              selected.has(id) ? selected.delete(id) : selected.add(id);
              renderInstalled();
            });
          });
        }
      }

      // ── Wiring ─────────────────────────────────────────────────────────────
      $('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const c = classify($('user').value);
        if (!c) return;
        if (c.type === 'account') search(c.user);
        else importDirect(c);
      });

      selectBtn.addEventListener('click', () => {
        selectMode = !selectMode;
        if (!selectMode) selected.clear();
        renderInstalled();
      });

      removeBtn.addEventListener('click', async () => {
        const ids = [...selected];
        if (!ids.length) return;
        const what = ids.length > 1 ? `${ids.length} apps` : 'this app';
        if (!confirm(`Remove ${what}? This stops ${ids.length > 1 ? 'them' : 'it'} and deletes the installed files (app data is kept).`)) return;
        removeBtn.disabled = true;
        removeBtn.textContent = 'Removing…';
        for (const id of ids) {
          try {
            await fetch('/shell/uninstall', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id }),
            });
          } catch {}
        }
        selected.clear();
        selectMode = false;
        window.parent.postMessage('shell:refresh', '*'); // update the rail
        await loadInstalled();
      });

      // Persist as the user types, so a pasted URL survives leaving the tab even
      // if they never pressed Go.
      $('user').addEventListener('input', persist);

      restore();
      renderResults();
      loadInstalled();
    </script>
  </body>
</html>
